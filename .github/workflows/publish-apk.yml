name: Repair retired signing-pin consumer

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'security/public-signing-containment-v1'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: security/public-signing-containment-v1
          fetch-depth: 1
          show-progress: false
      - name: Replace retired diagnostic pin reference
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('passgen/src/main/java/com/understory/passgen/MainActivity.kt')
          text = path.read_text()
          old = 'SuitePins.EXPECTED_CERT_SHA256'
          if text.count(old) != 1:
              raise SystemExit(f'expected one retired pin reference, found {text.count(old)}')
          path.write_text(text.replace(old, 'SuitePins.EXPECTED_RELEASE_CERT_SHA256'))
          PY
          git diff --check
      - name: Commit source repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add passgen/src/main/java/com/understory/passgen/MainActivity.kt
          git commit -m "Use release identity in diagnostic output"
          git push origin HEAD:security/public-signing-containment-v1
