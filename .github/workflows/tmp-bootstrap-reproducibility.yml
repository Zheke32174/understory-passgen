name: Temporary bootstrap reproducible v1 inputs

on:
  push:
    branches:
      - release/reproducible-v1
    paths:
      - .github/workflows/tmp-bootstrap-reproducibility.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK components
        shell: bash
        run: |
          set +e
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" > /dev/null
          sdk_status=${PIPESTATUS[1]}
          set -e
          exit "$sdk_status"
      - name: Generate Gradle 8.10.2 wrapper
        run: gradle wrapper --gradle-version 8.10.2 --distribution-type bin
      - name: Generate complete project lock state
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            :common-security:dependencies \
            :elevation:dependencies \
            :common-backup:dependencies \
            :passgen:dependencies \
            --write-locks
          for f in \
            common-security/gradle.lockfile \
            elevation/gradle.lockfile \
            common-backup/gradle.lockfile \
            passgen/gradle.lockfile; do
            test -s "$f" || { echo "missing/empty lockfile: $f" >&2; exit 1; }
          done
      - name: Verify locked build and unit tests
        run: ./gradlew --no-daemon :passgen:assembleDebug test
      - name: Record generated-input hashes
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.10.2-bin.zip' gradle/wrapper/gradle-wrapper.properties
          sha256sum \
            gradlew gradlew.bat \
            gradle/wrapper/gradle-wrapper.jar \
            gradle/wrapper/gradle-wrapper.properties \
            common-security/gradle.lockfile \
            elevation/gradle.lockfile \
            common-backup/gradle.lockfile \
            passgen/gradle.lockfile | tee reproducible-inputs.sha256
      - name: Commit generated reproducibility inputs to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            gradlew gradlew.bat gradle/wrapper \
            common-security/gradle.lockfile \
            elevation/gradle.lockfile \
            common-backup/gradle.lockfile \
            passgen/gradle.lockfile \
            reproducible-inputs.sha256
          git diff --cached --stat
          git commit -m "build: commit Gradle wrapper and dependency locks"
          git push origin HEAD:release/reproducible-v1
